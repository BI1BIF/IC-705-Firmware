<script>
"use strict";
const $ = s => document.querySelector(s);
let me = "BI1BIF", grid = "OM89";
const txGrid=()=>grid.slice(0,4);
const stations = [
  ["JA2IXS","PM83","jp","日本",-13,1050,2040],["BG5JKZ","OL78","cn","浙江",-14,1153,1276],
  ["DL1ABC","JO62","de","德国",-8,1250,7540],["F4ABC","JN18","fr","法国",-16,990,8240],
  ["K1ABC","FN42","us","美国",-17,831,10822],["G4ABC","IO91","gb","英国",-18,1438,8180]
].map(([call,loc,flag,qth,db,hz,km])=>({call,loc,flag,qth,db,hz,km}));
const examples = [
  ["本机叫 CQ","亮绿色报文表示对方在呼叫本台。点这一行可应答，也可点「呼叫」体验主动呼叫。"],
  ["点选追台","点一条最新 CQ，再按「呼叫」。点另一行可以查看，当前通联始终锁定同一台。"],
  ["无应答换台","点「呼叫」。首呼连续两次无应答后，当天跳过该台，继续选台。"],
  ["手动交换","选一条最新 CQ 并按「呼叫」。每次收到对方报告后，自己确认下一报。"],
  ["多人来叫","先呼叫 CQ。两台同一时隙来叫时，点绿色高亮行选一台；也可在菜单中预设接首台。"],
  ["未答转 CQ","点一条最新 CQ，再点「呼叫」。两次首呼无应答后转本机 CQ，直到新来叫或手动停止。"],
  ["保护休息","点「呼叫」模拟已接近 45 分钟的自动运行。休息期间仍可解码，演示模拟时钟满 5 分钟后恢复。"]
];
const roundNames = ["手动","半自动","全自动"], sorting = ["先收到","信号最强","距离最近","距离最远"];
const exitActions = {1:"换下一台",2:"本机叫 CQ"};
const dxccNames = {cn:"中国",jp:"日本",de:"德国",fr:"法国",us:"美国",gb:"英格兰"};
let st, timer=null, part=0;
const sec=()=>st.protocol==="FT4"?7.5:15;
const parity=n=>((n%2)+2)%2?"B":"A";
function node(tag,txt,cls){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function button(txt,fn,cls="key",disabled=false){const n=node("button",txt,cls);n.type="button";n.disabled=disabled;n.onclick=fn;return n}
function log(msg){st.events.unshift([stamp(),msg]);st.events.length=Math.min(st.events.length,12)}
function stamp(){return new Date(Date.UTC(2026,10,22,12,0)+(st.slot+part)*sec()*1000).toISOString().slice(11,19)}
const settingsKey="ic705-ft-simulator-prefs-v2";
const prefFields=["mode","order","limit","cool","after","strategy","cqSlot","firstCaller","protect","signalSort","prefix","exclude"];
function savePrefs(){
 try{localStorage.setItem(settingsKey,JSON.stringify({...Object.fromEntries(prefFields.map(k=>[k,st[k]])),me,grid}))}catch{}
}
function reset(i,restore=false){
 clearInterval(timer);timer=null;part=0;
  st={i,protocol:$("#protocol").value,slot:0,mode:[2,5,6].includes(i)?2:i===3?0:1,order:1,limit:3,cool:0,after:i===2?1:2,strategy:i===2?"找台":"本机 CQ",cqSlot:0,cqHz:1500,firstCaller:false,only:false,protect:true,started:null,resume:null,logPage:0,
     history:null,offset:0,selected:null,peek:null,screen:"rx",rows:[],nextId:0,events:[],worked:new Set(["G4ABC"]),cold:new Map(),q:null,ended:"",records:[],prefix:"",exclude:"",armed:false};
 if(restore){try{
   const prefs=JSON.parse(localStorage.getItem(settingsKey)||"{}");
   for(const key of prefFields)if(Object.hasOwn(prefs,key))st[key]=prefs[key];
   if(!exitActions[st.after])st.after=2;
   if(prefs.me&&prefs.grid){me=prefs.me;grid=prefs.grid}
 }catch{}}
 $("#response").value=i===2||i===5?"no":i===4?"multi":"yes";
 for(let n=-9;n<0;n++)traffic(n);
 if(i===0){
   const caller=stations.find(p=>p.call!==me&&!st.rows.some(r=>r.n===-1&&r.p.call===p.call));
   if(caller)add(-1,caller,me,caller.loc);
 }
 log("已进入实时守听");draw();
}
function add(n,p,to,extra){
 const r={id:++st.nextId,n,p,to,extra};st.rows.push(r);if(st.rows.length>120)st.rows.shift();return r
}
function traffic(n,quiet=[]){
 const shift=Math.abs(n)%2;
 [stations[shift],stations[1-shift],stations[2+Math.abs(n)%4]].filter(p=>!quiet.includes(p.call)).forEach(p=>add(n,p,"CQ",p.loc));
 const p=stations[3+Math.abs(n)%3];if(!quiet.includes(p.call))add(n,p,"W1XYZ",Math.abs(n)%2?"73":"R-12");
}
const lastRow=p=>st.rows.findLast(r=>r.p.call===p.call);
const report=db=>(db<0?"-":"+")+String(Math.abs(db)).padStart(2,"0");
function firstMessage(r){
 if(!r||r.to!==me)return txGrid();
 if(/^[+-]\d{2}$/.test(r.extra))return "R"+report(r.p.db);
 return /^[A-R]{2}\d{2}$/.test(r.extra)&&r.extra!=="RR73"?report(r.p.db):null
}
function canReply(r){return r && st.slot-r.n<=2 && lastRow(r.p).id===r.id && (r.to==="CQ"||(r.to===me?firstMessage(r)!==null:["73","RR73"].includes(r.extra)))}
function ranked(rows){return [...rows].sort((a,b)=>{
 if(st.order===1)return b.p.db-a.p.db;
 if(st.order>1){if(a.p.km==null||b.p.km==null)return (a.p.km==null)-(b.p.km==null);return (a.p.km-b.p.km)*(st.order===3?-1:1)}
 return a.id-b.id
})}
function candidate(){
 const eligible=st.rows.filter(canReply);
 const available=eligible.filter(r=>r.to!==me&&!st.worked.has(r.p.call)&&!(st.cold.get(r.p.call)>st.slot*sec())&&(!st.prefix||r.p.call.startsWith(st.prefix))&&(!st.exclude||!r.p.call.startsWith(st.exclude)));
 return ranked(eligible.filter(r=>r.to===me))[0]||ranked(available.filter(r=>r.to==="CQ"))[0]||ranked(available.filter(r=>r.to!=="CQ"))[0];
}
function start(peer=null,r=null,tx=st.cqSlot,hz=st.cqHz,missedPeer=""){
 st.armed=st.mode===2;
 if(st.armed&&st.started===null)st.started=st.slot*sec()-(st.i===6?2690:0);
 st.q={p:peer,tx,hz,extra:firstMessage(r),phase:"queued",tries:0,missedPeer};
 st.history=null;st.selected=null;st.peek=null;st.screen="rx";st.ended="";log("排队等 "+parity(tx)+" 发　"+outgoing());draw();
}
function outgoing(){const q=st.q;return q?[(q.p?.call||"CQ"),me,q.extra].join(" "):""}
function findPeer(){const r=candidate();if(r)start(r.p,r,1-(Math.abs(r.n)%2),r.p.hz);else start()}
function stop(note){st.q=null;st.armed=false;st.started=null;st.resume=null;st.selected=null;st.peek=null;st.ended=note;log(note);draw()}
function primary(){
 if(st.q||st.armed){stop("已停止，继续守听");return}
 if(st.history)return;
 if(st.selected){const r=st.selected;if(!canReply(r)){st.ended="报文已过期";draw();return}start(r.p,r,1-Math.abs(r.n%2),r.p.hz);return}
 if(st.mode===2){st.armed=true;if(st.strategy==="找台"){log("已开启自动找台");findPeer();draw();return}}
 start()

function afterQso(completed){
 const q=st.q,p=q.p;
 if(completed){
   const utc=new Date(Date.UTC(2026,10,22,12)+(st.slot*sec())*1000).toISOString().replace(/\D/g,"").slice(2,12);
   st.records.unshift([p.call,dxccNames[p.flag]||"–",p.loc||"–","20m",utc]);st.worked.add(p.call);log(p.call+" 完成通联，已记入演示日志")
 }else{
   if(p){
     const now=st.slot*sec();
     const midnight=now+86400-(now+12*3600)%86400;
     st.cold.set(p.call,st.cool===0?midnight:now+st.cool*60);
     log(p.call+" 无应答，进入冷却")
   }else log((p?.call||"CQ")+" 无应答，到达次数上限")
 }
 st.q=null;st.selected=null;st.peek=null;
 if(!st.armed){st.started=null;st.ended=completed?"已记录通联":"到限 · 已停止";return}
 if(completed?st.strategy==="本机 CQ":st.after===2){
   if(!completed&&p)log(p.call+" 到限，转本机 CQ");
   start(null,null,st.cqSlot,st.cqHz,completed?"":p?.call||"");return
 }
 st.ended="等新候选";findPeer()
}
function acceptCaller(q,r){
 q.p=r.p;q.extra=report(r.p.db);q.tries=0;q.callers=null;q.missedPeer="";
 q.phase=st.mode===0?"confirm":"queued";

}
function pickCaller(q,r){
 if(q.phase!=="pick"||!q.callers.some(c=>c.id===r.id))return;
 acceptCaller(q,r);
 // A paused boundary can still start this slot. A choice made later waits for the next complete TX slot.
 if(q.phase==="queued"&&st.slot%2===q.tx&&part===0){q.phase="air";log("开始模拟发射　"+outgoing())}
 draw()
}
function processReply(q,n){
 const will=$("#response").value;
 if(will==="no"||(will==="last"&&q.tries<attemptLimit(q)))return false;
 if(q.extra==="RR73"){add(n,q.p,me,"73");afterQso(true);return true}
 if(!q.p){
   const callers=(will==="multi"?stations.slice(0,2):stations.slice(0,1)).map(p=>add(n,p,me,p.loc));
   if(!callers.length)return false;
   if(callers.length>1&&st.mode!==2&&!st.firstCaller){
     q.callers=callers;q.phase="pick";st.screen="rx";st.history=null;st.peek=null;
     log("两台同隙来叫，点高亮行选台");return true
   }
   acceptCaller(q,st.mode===2?ranked(callers)[0]:callers[0]);return true
 }else{
   const reply=q.extra===txGrid()?"-09":q.extra.startsWith("R")?"RR73":"R-09";
   add(n,q.p,me,reply);
   q.extra=reply==="RR73"?"73":reply==="R-09"?"RR73":"R"+report(q.p.db);
 }
 q.tries=0;q.phase=st.mode===0?"confirm":"queued";log(q.p.call+" 已应答，下一报 "+q.extra);return true;
}
function attemptLimit(q){return st.mode===2&&q.p&&q.extra===txGrid()?Math.min(2,st.limit):st.limit}
function step(){
 const n=st.slot, q=st.q;part=0;
 if(q?.phase==="air"){
   q.tries++;log("已发 "+q.tries+"/"+attemptLimit(q)+"　"+outgoing());
   if(q.extra==="73")afterQso(true);else q.phase="listen"
 }else{
   const awaiting=q?.phase==="listen"&&n%2!==q.tx;
   const quiet=q?.phase==="pick"?q.callers.map(r=>r.p.call):awaiting?(q.p?[q.p.call]:stations.slice(0,$("#response").value==="multi"?2:1).map(p=>p.call)):[];
   traffic(n,quiet);
   if(q?.phase==="pick"&&n-q.callers[0].n>=2){
     q.callers=null;log("来叫已过期，本轮未选台");
     if(q.tries>=st.limit)afterQso(false);else q.phase=st.mode===0?"confirm":"queued"
   }
   if(q?.phase==="listen" && n%2!==q.tx && !processReply(q,n)){
     if(!q.p&&st.armed&&st.strategy==="找台")findPeer();
     else if(q.tries>=attemptLimit(q))afterQso(false);
     else if(st.mode===0){q.phase="confirm";log("本轮未答，等手动确认重发")}
     else q.phase="queued"
   }
   if(st.armed&&!st.q&&st.resume===null)findPeer()
 }
 st.slot++;
 if(st.armed&&st.protect&&st.resume===null&&st.slot*sec()-st.started>=2700){
   st.q=null;st.resume=st.slot*sec()+300;log("保护休息 5 分钟，继续守听");
 }else if(st.resume!==null&&st.slot*sec()>=st.resume){
   st.resume=null;st.started=st.slot*sec();if(st.strategy==="找台")findPeer();else start();
 }
 if(st.q?.phase==="queued" && st.slot%2===st.q.tx){st.q.phase="air";log("开始模拟发射　"+outgoing())}
 draw()
}

const latinFont="600 13px FTLatin";
const measure=document.createElement("canvas").getContext("2d");
function stampPixels(el,value,strikeFrom=-1,strikeEnd=-1){
 const chars=Array.from(value.replaceAll("　","  "));
 if(!chars.length)return;
 measure.font=latinFont;
 const offsets=[0];
 for(const ch of chars)offsets.push(offsets.at(-1)+(ch.charCodeAt(0)<128?measure.measureText(ch).width:16));
 const canvas=node("canvas",undefined,"pixel");
 canvas.width=Math.ceil(offsets.at(-1));canvas.height=15;canvas.setAttribute("aria-hidden","true");
 const ctx=canvas.getContext("2d"),color=getComputedStyle(el).color;
 ctx.fillStyle=color;
 chars.forEach((ch,i)=>{
   const x=offsets[i],n=pixelChars.indexOf(ch);
   if(ch.charCodeAt(0)<128){ctx.font=latinFont;ctx.fillText(ch,x,12)}
   else if(n>=0){ctx.drawImage(sheet,n%16*16,Math.floor(n/16)*15,16,15,Math.round(x),0,16,15)}
   else{ctx.font='600 13px sans-serif';ctx.fillText(ch,x,12)}
 });
 ctx.globalCompositeOperation="source-in";ctx.fillStyle=color;ctx.fillRect(0,0,canvas.width,15);
 if(strikeFrom>=0){ctx.globalCompositeOperation="source-over";ctx.fillStyle="#ffd65a";ctx.fillRect(offsets[strikeFrom],7,offsets[strikeEnd]-offsets[strikeFrom],2)}
 el.replaceChildren(node("span",value,"accessible-text"),canvas);
}
function stampCaption(el,value){
 el.replaceChildren();el.classList.add("lcd-caption");
 for(const part of value.match(/[A-Za-z0-9]+|./gu)||[]){
   const run=node("span",part);el.append(run);stampPixels(run,part);
 }
}
function paintLCD(){
 if(!sheet.complete||!sheet.naturalWidth)return;
 document.querySelectorAll(".packet").forEach(el=>stampPixels(el,el.textContent));
 document.querySelectorAll(".phase,.hdr>.num,.qth-heading,.rail .key,.status .line,.entry .field-name,.entry .field-value,.row .place,.rail .pageno,.panel h3,.edit-label,.logtable th").forEach(el=>stampPixels(el,el.textContent));
 document.querySelectorAll(".readout,.logtable td").forEach(el=>{stampPixels(el,el.textContent)});
 document.querySelectorAll(".empty-log,.panel form p,.panel .notice").forEach(el=>{if(el.textContent)stampCaption(el,el.textContent)});
 document.querySelectorAll(".row .num").forEach(el=>{if(/^[0-9+-]+$/.test(el.textContent))stampPixels(el,el.textContent)});
 document.querySelectorAll(".row .msg").forEach(el=>{
   const text=el.textContent,call=el.querySelector("s")?.textContent||"",at=call?text.indexOf(" ")+1:-1;
   stampPixels(el,text,at,at+call.length);el.title=text
 });
}

function draw(){
 const q=st.q, busy=!!q||st.armed,selected=st.selected,pane=$(".pane"),rail=$(".rail");
 const editing=["call","filter","station"].includes(st.screen)&&pane.dataset.page===st.screen;
 if(!editing){pane.replaceChildren();if(st.screen==="rx")list(pane);else menu(pane);pane.dataset.page=st.screen}
 rail.replaceChildren();
 const action=busy?"停止":"呼叫";
 const invoke=()=>{if(!busy&&selected?.typed){start(selected.p,null,selected.tx,selected.hz);return}primary()};
 const status=node("div",undefined,"status");
 function line(txt,color){const n=node("div",txt,"line");n.style.color=color||"#dfedf3";status.append(n)}
 rail.classList.toggle("history",!!st.history&&st.screen==="rx");
 rail.classList.toggle("subpage",st.screen!=="rx");
 if(st.screen!=="rx"){
   const page=st.screen;
   if(["call","station","filter"].includes(page)){
     const submit=node("button",{call:"选定对台",station:"保存",filter:"应用"}[page],"key primary");submit.type="submit";submit.setAttribute("form","ft-edit");rail.append(submit);
   }else{
     const isLog=page==="log",pages=isLog?Math.max(1,Math.ceil(st.records.length/7)):Number($(".menuitems").dataset.pages);
     const index=isLog?st.logPage:(st.pages?.[page]||0);
     const flip=d=>{if(isLog)st.logPage=index+d;else (st.pages??={})[page]=index+d;draw()};
     rail.append(button("上页",()=>flip(-1),"key primary",index===0),button("下页",()=>flip(1),"key next-page",index+1>=pages));
     if(pages>1)rail.append(node("span",(index+1)+"/"+pages,"page-index"));
   }
   if(busy)rail.append(button("停止",invoke,"key stop"));
   rail.append(button("返回",()=>{st.screen=page==="menu"?"rx":"menu";draw()},"key bottom"));
 }else if(st.history){
   if(busy)rail.append(button("停止",invoke,"key stop"));
   const keys=node("div",undefined,"histkeys");keys.append(button("上页",()=>turn(1),"key",st.offset>=Math.ceil(st.history.length/10)-1),button("下页",()=>turn(-1),"key",!st.offset),button("实时",history));
   rail.append(keys,node("div",(st.offset+1)+"/"+Math.max(1,Math.ceil(st.history.length/10)),"pageno"));
 }else{
   const confirming=q?.phase==="confirm"&&st.screen==="rx";
   const bottom=confirming?button("▶发送",()=>{q.phase=st.slot%2===q.tx&&part===0?"air":"queued";log("已确认　"+outgoing());draw()}):
    button(st.screen==="rx"?"菜单":"返回",()=>{st.screen=st.screen==="rx"?"menu":st.screen==="menu"?"rx":"menu";draw()});
   bottom.classList.add("bottom");
   rail.append(button(action,invoke,busy?"key stop":"key start",!busy&&(st.screen!=="rx"||(selected&&!selected.typed&&!canReply(selected)))),status,bottom);
   line(roundNames[st.mode]);line(st.protocol+(q?.phase==="air"?" 发":" 收"));
   status.append(node("div","","side-clock"));
   if(st.resume!==null)line("休息 "+Math.ceil(st.resume-st.slot*sec())+"s");
   else if(q?.phase==="pick")line("点选对台");
   else if(q||selected){
     const extra=q?q.extra:firstMessage(selected);
     const stage=q&&!q.p?"1/6 CQ":extra===txGrid()?"2/6 首呼":extra==="RR73"?"5/6 RR73":extra==="73"?"6/6 收尾":extra?.startsWith("R")?"4/6 回报":"3/6 报告";
     line(stage);if(q&&q.tries)line("已发 "+q.tries+" 次");
   }
   if(st.screen==="rx"){
     const keys=node("div",undefined,"slot-keys");keys.setAttribute("role","group");keys.setAttribute("aria-label","本机 CQ 发射轮次");
     const own=q?q.tx:selected?(selected.typed?selected.tx:1-Math.abs(selected.n%2)):st.cqSlot;
     for(const [i,letter] of ["A","B"].entries()){
       const key=button(letter,()=>{st.cqSlot=i;savePrefs();log("本机 CQ 选 "+letter);draw()},"key",busy||!!selected);
       key.setAttribute("aria-pressed",String(i===own));keys.append(key);
     }
     rail.insertBefore(keys,bottom);
   }
 }
 $(".tx").hidden=q?.phase!=="air";$("#play").textContent=timer?"暂停演示":"连续演示";
 $("#guide").textContent=examples[st.i][1];
 $(".trail").replaceChildren(...st.events.slice(0,5).map(([t,msg])=>{const li=node("li");li.append(node("time",t),node("span",msg));return li}));
 paintLCD();
 document.querySelectorAll(".preset").forEach((b,i)=>b.setAttribute("aria-pressed",i===st.i));meters()
}
$(".native").style.backgroundImage="url("+assets.header+")";
examples.forEach(([txt],i)=>$(".presets").append(button(txt,()=>reset(i),"preset")));
$("#step").onclick=step;$("#play").onclick=play;$("#protocol").onchange=()=>reset(st.i);
new ResizeObserver(()=>$(".lcd").style.transform="scale("+$(".glass").clientWidth/480+")").observe($(".glass"));
$("#zoom").onclick=()=>{const zoom=$(".case").classList.toggle("zoom");$("#zoom").textContent=zoom?"原始像素":"放大预览";$("#zoom").setAttribute("aria-pressed",zoom);$("#scaleinfo").textContent="480 × 272 · "+(zoom?"缩放预览":"原始像素")};
reset(0,true);
document.fonts.load(latinFont).then(()=>draw());
</script></html>
