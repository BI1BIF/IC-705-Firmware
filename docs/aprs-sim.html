<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>APRS 模拟操作 · IC-705</title>
  <link rel="stylesheet" href="converter/style.css">
  <link rel="stylesheet" href="converter/aprs-sim.css">
  <script type="module" src="converter/aprs-sim.js"></script>
</head>
<body class="aprs-sim">
  <header><div class="bar">
    <a href="./" data-en="← Firmware converter">← 固件转换器</a>
    <a href="ftx-v2-sim.html" data-en="FT8 / FT4 simulator">FT8／FT4 模拟操作</a>
  </div></header>
  <main>
    <h1 data-en="APRS simulator">APRS 模拟操作</h1>
    <p data-en="Choose a sample packet, or use QUICK → APRS RX List to review reception history.">选择一种报文体验接收弹窗，或按 QUICK → APRS RX List 查看收包记录。</p>
    <div class="sim-grid">
      <div class="panel">
        <div class="lcd" lang="en">
          <div class="radio-status">
            <span><b>FM</b> <b>APRS</b> <b>BCN</b></span>
            <span>144.640 <small>MHz</small></span>
          </div>
          <div id="screen" tabindex="-1"></div>
        </div>
        <div class="panel-keys">
          <button type="button" data-action="quick" aria-controls="screen">QUICK</button>
          <button type="button" data-action="exit" aria-controls="screen">EXIT</button>
        </div>
      </div>
      <section class="sample-panel" aria-labelledby="sample-title">
        <h2 id="sample-title" data-en="Simulate reception">模拟收包</h2>
        <div class="sample-buttons">
          <button type="button" data-action="receive:position" data-en="Position beacon">位置信标</button>
          <button type="button" data-action="receive:weather" data-en="Weather">气象</button>
          <button type="button" data-action="receive:message" data-en="Direct message">短消息</button>
          <button type="button" data-action="receive:status" data-en="Status">状态报文</button>
          <button type="button" data-action="receive:igate" data-en="IGate">网关</button>
          <button type="button" data-action="receive:relayed" data-en="Own beacon relayed">自台信标被转发</button>
        </div>
        <label for="position-source" data-en="Local position">本机位置</label>
        <select id="position-source">
          <option value="MANUAL" data-en="Manual">手动位置</option>
          <option value="GPS">GPS</option>
          <option value="NO FIX" data-en="No fix">无定位</option>
        </select>
        <p data-en="Sample data only. All sends are simulated in this browser.">使用演示报文，发射也在浏览器内模拟。</p>
      </section>
    </div>
    <p id="announcement" class="sim-sr-only" role="status"></p>
  </main>
</body>
</html>
